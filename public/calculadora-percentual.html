@layer base {
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  main > :first-child { margin-top: 0 !important; }
  main > :last-child { margin-bottom: 0 !important; }
}
::-webkit-scrollbar { display: none; }

/* Ambient Orbs Floating Animations */
@keyframes float-slow {
  0%, 100% { transform: translate(0px, 0px) scale(1); }
  33% { transform: translate(35px, -28px) scale(1.08); }
  66% { transform: translate(-25px, 20px) scale(0.95); }
}
@keyframes float-medium {
  0%, 100% { transform: translate(0px, 0px) scale(1); }
  40% { transform: translate(-30px, -35px) scale(1.12); }
  75% { transform: translate(25px, 25px) scale(0.92); }
}
@keyframes float-gentle {
  0%, 100% { transform: translate(0px, 0px) scale(0.98); }
  50% { transform: translate(20px, -20px) scale(1.06); }
}

.animate-orb-1 {
  animation: float-slow 12s ease-in-out infinite;
}
.animate-orb-2 {
  animation: float-medium 10s ease-in-out infinite;
}
.animate-orb-3 {
  animation: float-gentle 9s ease-in-out infinite;
}

/* Button Shimmer Sweep Effect */
@keyframes shimmer-sweep {
  0% { transform: translateX(-150%) skewX(-20deg); }
  45%, 100% { transform: translateX(250%) skewX(-20deg); }
}
.shimmer-effect::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.32), transparent);
  animation: shimmer-sweep 3.6s infinite ease-in-out;
  pointer-events: none;
}

/* Staggered Entrance Animations */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.reveal-anim {
  opacity: 0;
  animation: fadeInUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.15s; }
.delay-3 { animation-delay: 0.28s; }
.delay-4 { animation-delay: 0.40s; }
.delay-5 { animation-delay: 0.52s; }

/* Interactive Hover Lift & Smooth Transitions */
.card-elevation {
  transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
  will-change: transform, box-shadow;
}
.card-elevation:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 38px -10px rgba(0, 74, 198, 0.11), 0 10px 18px -6px rgba(11, 28, 48, 0.06);
}

/* Swap Icon Interactive Elastic Spring */
.swap-interactive {
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
}
.swap-interactive:hover {
  transform: rotate(180deg) scale(1.08);
}
.swap-interactive:active {
  transform: rotate(360deg) scale(0.92);
}

/* Progress bar glowing tip */
.glow-tip {
  position: relative;
}
.glow-tip::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  background-color: #ffffff;
  box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.85);
}

/* Pulse Dot Animation for Header Status */
@keyframes status-pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 108, 73, 0.65); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 108, 73, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 108, 73, 0); }
}
.pulsing-indicator {
  animation: status-pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
}

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

<script>
    /* ===== Design original + motor validado do sistema (calcPercentual) ===== */
    let resultadoAtivo = false;
    let marcaCfg = { logoClaro: null };
    let cabecalhoOriginal = null;
    const CHAVE_ESTADO = 'per-estado';

    /**
 * Calcula as relações percentuais entre dois valores A e B.
 *
 * - variacaoAB: variação percentual ao ir de A para B (assimétrica, com sinal)
 * - variacaoBA: variação percentual ao ir de B para A (assimétrica, com sinal)
 * - diferencaSimetrica: diferença percentual simétrica, útil quando não há
 *   uma ordem natural "antes/depois" entre os valores (usa a média como base)
 * - diferencaAbsoluta: |A - B|
 */
function calcPercentual(a, b) {
  const diferencaAbsoluta = Math.abs(a - b);
  const media = (a + b) / 2;

  const variacaoAB = a !== 0 ? ((b - a) / Math.abs(a)) * 100 : null;
  const variacaoBA = b !== 0 ? ((a - b) / Math.abs(b)) * 100 : null;
  const diferencaSimetrica = media !== 0 ? (diferencaAbsoluta / Math.abs(media)) * 100 : null;

  return { diferencaAbsoluta, variacaoAB, variacaoBA, diferencaSimetrica };
}


    function $(id) { return document.getElementById(id); }
    function setT(id, t) { const el = $(id); if (el) el.textContent = t; }

    function parseCurrency(str) {
      if (!str && str !== 0) return 0;
      const clean = str.toString().replace(/[^0-9,\.-]/g, '').replace(/\./g, '').replace(',', '.');
      const val = parseFloat(clean);
      return isNaN(val) ? 0 : val;
    }
    function formatCurrencySimple(num) {
      return Number(num || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function formatPercent(num, withSign) {
      if (num === null || !isFinite(num)) return 'N/A';
      const sign = withSign && num > 0 ? '+' : '';
      return `${sign}${num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
    }
    function mascaraMoeda(el) {
      let d = el.value.replace(/\D/g, '');
      if (!d) d = '0';
      el.value = formatCurrencySimple(parseInt(d, 10) / 100);
    }

    const CLASSE_BASE = 'font-headline font-extrabold text-2xl lg:text-3xl tracking-tight tabular-nums transition-all duration-300';
    function corMetrica(el, v) {
      if (!el || v === null || !isFinite(v)) { if (el) el.className = CLASSE_BASE + ' text-on-surface'; return; }
      const cor = v < 0 ? 'text-error' : (v > 0 ? 'text-secondary' : 'text-on-surface');
      el.className = CLASSE_BASE + ' ' + cor;
    }
    function flashValue(el) {
      if (!el) return;
      el.style.transform = 'scale(1.05)';
      setTimeout(() => { el.style.transform = 'scale(1)'; }, 200);
    }

    function setAviso(texto) {
      let msg = $('per-aviso');
      const botao = $('calculate-btn');
      if (!msg && botao) {
        msg = document.createElement('div');
        msg.id = 'per-aviso';
        msg.style.cssText = 'margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:600;background:#fff;border:1px solid #fca5a5;color:#b91c1c;display:none';
        botao.parentElement.appendChild(msg);
      }
      if (msg) { msg.textContent = texto || ''; msg.style.display = texto ? 'block' : 'none'; }
    }

    /* Cartoes de resultado ficam no lugar; sem calculo mostram tracos */
    function setPlaceholders() {
      ['metric-a-to-b', 'metric-b-to-a', 'metric-symmetric', 'metric-absolute', 'bar-a-label', 'bar-b-label'].forEach(id => setT(id, '—'));
      corMetrica($('metric-a-to-b'), null);
      corMetrica($('metric-b-to-a'), null);
      const ba = $('bar-a'), bb = $('bar-b');
      if (ba) ba.style.width = '0%';
      if (bb) bb.style.width = '0%';
      setT('analysis-text', 'Informe os dois valores e clique em Calcular para ver a análise.');
    }

    function salvarEstado() {
      try {
        sessionStorage.setItem(CHAVE_ESTADO, JSON.stringify({
          a: $('input-a').value, b: $('input-b').value, calculado: resultadoAtivo
        }));
      } catch (e) { /* armazenamento indisponivel */ }
    }
    function restaurarEstado() {
      try {
        const s = JSON.parse(sessionStorage.getItem(CHAVE_ESTADO) || 'null');
        if (!s) return false;
        $('input-a').value = s.a;
        $('input-b').value = s.b;
        if (s.calculado) calcularPercentual();
        return true;
      } catch (e) { return false; }
    }

    /* Qualquer alteracao invalida o resultado anterior: e preciso calcular de novo */
    function onInputChanged() {
      resultadoAtivo = false;
      setPlaceholders();
      setAviso('');
      salvarEstado();
    }

    /* Calculo: usa exatamente calcPercentual do sistema */
    function calcularPercentual() {
      const a = parseCurrency($('input-a').value);
      const b = parseCurrency($('input-b').value);
      if (!(a > 0 && b > 0)) {
        resultadoAtivo = false;
        setPlaceholders();
        setAviso('Informe dois valores maiores que zero.');
        salvarEstado();
        return false;
      }
      setAviso('');
      const r = calcPercentual(a, b);

      const metricAtoB = $('metric-a-to-b');
      const metricBtoA = $('metric-b-to-a');
      setT('metric-a-to-b', formatPercent(r.variacaoAB, true));
      corMetrica(metricAtoB, r.variacaoAB);
      setT('metric-b-to-a', formatPercent(r.variacaoBA, true));
      corMetrica(metricBtoA, r.variacaoBA);
      setT('metric-symmetric', formatPercent(r.diferencaSimetrica, false));
      setT('metric-absolute', `R$ ${formatCurrencySimple(r.diferencaAbsoluta)}`);
      [metricAtoB, metricBtoA, $('metric-symmetric'), $('metric-absolute')].forEach(flashValue);

      const maxVal = Math.max(Math.abs(a), Math.abs(b), 1);
      const pctA = Math.min(100, Math.max(6, Math.round((Math.abs(a) / maxVal) * 100)));
      const pctB = Math.min(100, Math.max(6, Math.round((Math.abs(b) / maxVal) * 100)));
      const barA = $('bar-a'), barB = $('bar-b');
      if (barA) barA.style.width = `${pctA}%`;
      if (barB) barB.style.width = `${pctB}%`;
      setT('bar-a-label', `${pctA}% (R$ ${formatCurrencySimple(a)})`);
      setT('bar-b-label', `${pctB}% (R$ ${formatCurrencySimple(b)})`);

      const direcao = r.variacaoAB < 0 ? 'redução nominal de' : 'acréscimo nominal de';
      const destaque = r.variacaoAB < 0 ? 'text-error' : 'text-secondary';
      const an = $('analysis-text');
      if (an) an.innerHTML = `
        O <strong class="text-on-surface font-semibold">Valor B (R$ ${formatCurrencySimple(b)})</strong> representa uma
        ${direcao} <strong class="${destaque} font-semibold">${formatPercent(r.variacaoAB, true)}</strong> em relação ao
        <strong class="text-on-surface font-semibold">Valor A (R$ ${formatCurrencySimple(a)})</strong>.
        A diferença líquida apurada entre os dois montantes é de <strong class="text-secondary font-semibold">R$ ${formatCurrencySimple(r.diferencaAbsoluta)}</strong>
        (diferença simétrica ponderada de <strong>${formatPercent(r.diferencaSimetrica, false)}</strong>).
      `;

      resultadoAtivo = true;
      salvarEstado();
      return true;
    }

    /* Cabecalho: sino de notificacoes no lugar do perfil */
    function montarCabecalho() {
      const header = document.querySelector('header');
      if (!header) return;
      const op = Array.from(header.querySelectorAll('*')).find(e => e.children.length === 0 && e.textContent.includes('Operador'));
      const perfil = op ? op.closest('header > div > div > div') : null;
      const grupo = perfil ? perfil.parentElement : (header.firstElementChild ? header.firstElementChild.lastElementChild : null);
      if (perfil) perfil.remove();
      const sino = document.createElement('button');
      sino.id = 'bell-slot';
      sino.type = 'button';
      sino.setAttribute('aria-label', 'Notificações');
      sino.style.cssText = 'display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;border:1px solid #d3e4fe;background:#fff;color:#0b1c30;cursor:pointer';
      sino.innerHTML = '<span class="material-symbols-outlined text-[18px]">notifications</span>';
      if (grupo) grupo.appendChild(sino);
    }

    /* Logomarca vinda das configuracoes, no lugar da marca do design */
    function aplicarLogo() {
      const header = document.querySelector('header');
      if (!header) return;
      const brandSpan = Array.from(header.querySelectorAll('span')).find(s => s.firstElementChild && s.firstElementChild.textContent.trim() === '.car');
      const brandBox = brandSpan ? brandSpan.parentElement : null;
      if (!brandBox) return;
      if (cabecalhoOriginal === null) cabecalhoOriginal = brandBox.innerHTML;
      brandBox.innerHTML = marcaCfg.logoClaro
        ? `<img src="${marcaCfg.logoClaro}" alt="SliceX.calc" style="height:34px;width:auto;display:block">`
        : cabecalhoOriginal;
    }

    function postParent(msg) { if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin); }
    function enviarRetangulo() {
      const el = $('bell-slot');
      if (!el) return;
      const r = el.getBoundingClientRect();
      postParent({ type: 'bell-rect', rect: { x: r.left, y: r.top, w: r.width, h: r.height } });
    }
    window.addEventListener('resize', enviarRetangulo);
    window.addEventListener('message', (e) => {
      if (e.source !== window.parent) return;
      const d = e.data || {};
      if (d.type === 'marca') { marcaCfg = { logoClaro: d.logoClaro }; aplicarLogo(); }
    });

    function init() {
      montarCabecalho();
      aplicarLogo();
      const a = $('input-a'), b = $('input-b');
      [a, b].forEach(el => {
        if (!el) return;
        el.addEventListener('input', () => { mascaraMoeda(el); onInputChanged(); });
        el.addEventListener('blur', () => { el.value = formatCurrencySimple(parseCurrency(el.value)); });
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') calcularPercentual(); });
      });
      const calc = $('calculate-btn');
      if (calc) calc.addEventListener('click', calcularPercentual);
      const swap = $('swap-values-btn');
      if (swap) swap.addEventListener('click', () => {
        const t = a.value; a.value = b.value; b.value = t;
        if (resultadoAtivo) calcularPercentual(); else onInputChanged();
      });
      const reset = $('reset-btn');
      if (reset) reset.addEventListener('click', () => {
        a.value = '0,00';
        b.value = '0,00';
        onInputChanged();
      });
      const copy = $('copy-summary-btn');
      if (copy) copy.addEventListener('click', () => {
        const txt = `Calcula.car - Análise de Diferença Percentual:\nValor A: R$ ${a.value}\nValor B: R$ ${b.value}\nVariação A -> B: ${$('metric-a-to-b').textContent.trim()}\nVariação B -> A: ${$('metric-b-to-a').textContent.trim()}\nDiferença Simétrica: ${$('metric-symmetric').textContent.trim()}\nDiferença Absoluta: ${$('metric-absolute').textContent.trim()}`;
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(txt).then(() => {
          const fb = $('copy-text-feedback');
          if (!fb) return;
          fb.textContent = 'Copiado para a área de transferência!';
          setTimeout(() => { fb.textContent = 'Copiar dados da análise'; }, 2200);
        });
      });
      setPlaceholders();
      setAviso('');
      const restaurou = restaurarEstado();
      if (!restaurou) setPlaceholders();
      postParent({ type: 'pronto' });
      enviarRetangulo();
    }
    init();
</script></main><footer class="w-full bg-surface-container-lowest/90 backdrop-blur-md mt-auto border-t border-outline-variant/30 shadow-[0_-1px_6px_rgba(11,28,48,0.03)]"><div class="max-w-7xl mx-auto px-6 lg:px-12 py-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-label text-on-surface-variant"><div class="flex items-center gap-3"><div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-surface-container/80 text-on-surface font-medium border border-outline-variant/40"><span class="material-symbols-outlined text-secondary text-[16px]">lock</span><span class="">SSL 256-Bit Encrypted</span></div><span class="text-on-surface-variant">© 2025 Calcula.car Brasil Tecnologia Automotiva S.A. Todos os direitos reservados.</span></div><div class="flex items-center gap-6"><span class="text-on-surface-variant">Conformidade LGPD &amp; BACEN F&amp;I</span><a class="hover:text-primary transition-colors font-medium" data-path="suporte" href="#">Suporte Operacional</a></div></div></footer>
